name: UI screenshots (iOS Simulator)

# Builds the app for the iOS Simulator, runs mobile/maestro/screen_tour.yaml on an
# iPhone Air and the smallest current iPhone, and force-pushes the screenshots to the
# ui-screenshots branch for review before a device build (docs/ui_conventions.md).
# Screenshots come from a fresh simulator install with test data only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/app/**'
      - 'mobile/src/ui/**'
      - 'mobile/maestro/**'
      - 'mobile/tools/run_ui_screenshots.sh'
      - '.github/workflows/ui-screenshots-ios-simulator.yml'

permissions:
  contents: write

concurrency:
  group: ui-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the iOS Simulator
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build | tee xcodebuild.log | grep -E '^(\*\*|error:|.*error:)' || true
          APP="build/Build/Products/Release-iphonesimulator/$SCHEME.app"
          test -d "$APP" || { tail -200 xcodebuild.log; exit 1; }
          # The Keychain (database key, expo-secure-store) needs a signed app with entitlements,
          # so the simulator build is ad-hoc signed ("Sign to Run Locally").
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || { echo '::error::simulator app is not signed'; exit 1; }
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          echo "APP_PATH=$(pwd)/$APP" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run screen tour on simulators
        id: tour
        continue-on-error: true
        run: |
          maestro --version
          bash tools/run_ui_screenshots.sh "$APP_PATH"

      - name: Publish screenshots to the ui-screenshots branch
        if: always()
        working-directory: mobile/ui-screenshots
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# UI screenshots"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tour result: ${{ steps.tour.outcome }}"
            echo
            cat SUMMARY.md 2>/dev/null
          } > README.md
          git init -q -b ui-screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "UI screenshots for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-screenshots

      - name: Fail if the tour failed
        if: steps.tour.outcome != 'success'
        run: exit 1
