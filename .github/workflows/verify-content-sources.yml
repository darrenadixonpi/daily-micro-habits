name: Verify content against sources

# The verification pass of spec Section 6 for bundled content: A5 events against their
# Wikipedia date pages, A3 source links, A1 headwords and IPA against Wiktionary.
on:
  workflow_dispatch:
    inputs:
      dump_dates:
        description: 'Comma-separated MM-DD dates: print their Wikipedia Events sections instead of verifying'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/verify_content_sources.py'
      - 'tools/a5_verification_keywords.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print Wikipedia events for chosen dates
        if: ${{ github.event.inputs.dump_dates != '' }}
        run: python3 -I tools/verify_content_sources.py --dump-events "${{ github.event.inputs.dump_dates }}"
      - name: Check sources
        if: ${{ github.event.inputs.dump_dates == '' || github.event.inputs.dump_dates == null }}
        run: python3 -I tools/verify_content_sources.py "$RUNNER_TEMP/content_verification.md"
      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/content_verification.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-verification
          path: ${{ runner.temp }}/content_verification.md
