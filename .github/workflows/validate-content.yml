name: Validate content

on:
  push:
    paths: ['content/**', 'schemas/**', 'tools/**', '.github/workflows/validate-content.yml']
  pull_request:
    paths: ['content/**', 'schemas/**', 'tools/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python -I tools/validate_content.py content/*.json
