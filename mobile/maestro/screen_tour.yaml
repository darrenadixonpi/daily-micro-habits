# Visits every screen on a fresh install, types into every text field, and takes a
# screenshot of each state. A field hidden under a header or the keyboard cannot be
# typed into, so the following assertVisible fails and the run fails.
appId: com.darrendixon.dailymicrohabits
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- takeScreenshot: 00_after_launch

# Passphrase setup (modal, opened automatically on first launch)
- extendedWaitUntil:
    visible:
      id: "screen-passphrase"
    timeout: 60000
- takeScreenshot: 01_passphrase_setup
- tapOn:
    id: "passphrase-first"
- takeScreenshot: 01a_passphrase_first_focused
- inputText: "maestro screenshot passphrase"
- takeScreenshot: 01b_passphrase_first_typed
- tapOn:
    id: "passphrase-second"
- inputText: "maestro screenshot passphrase"
- takeScreenshot: 01c_passphrase_second_typed
- tapOn:
    id: "passphrase-title"
- takeScreenshot: 02_passphrase_filled
- tapOn:
    id: "passphrase-save"

# Today (the app asks for notification permission only now, after setup)
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 30000
- extendedWaitUntil:
    visible: "Allow"
    timeout: 5000
    optional: true
- tapOn:
    text: "Allow"
    optional: true
# Maestro may repeat the tap after the alert closes; if that opened a screen, go back.
- runFlow:
    when:
      notVisible:
        id: "screen-today"
    commands:
      - tapOn:
          text: "Back"
          optional: true
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- takeScreenshot: 03_today_start

# A3 Concept of the day (day 1: no recall question yet)
- tapOn:
    id: "today-module-A3"
- extendedWaitUntil:
    visible:
      id: "screen-a3"
    timeout: 10000
- takeScreenshot: 03a_a3_concept
- scrollUntilVisible:
    element:
      id: "a3-read"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- takeScreenshot: 03b_a3_concept_end
- tapOn:
    id: "a3-read"
- assertVisible:
    id: "a3-done"
- scrollUntilVisible:
    element:
      id: "a3-more"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- tapOn:
    id: "a3-more"
- assertVisible:
    id: "a3-tweak-message"
- tapOn:
    id: "a3-simpler"
- assertVisible:
    text: ".*API key.*"
- takeScreenshot: 03c_a3_tweaks
- tapOn: "Back"

# A1 Word of the day (first tier-2 word: obviate)
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- tapOn:
    id: "today-module-A1"
- extendedWaitUntil:
    visible:
      id: "screen-a1"
    timeout: 10000
- takeScreenshot: 03d_a1_word
- tapOn:
    id: "a1-sentence"
- inputText: "Good tooling can obviate most manual release steps."
- assertVisible:
    text: "Good tooling can obviate.*"
- tapOn:
    id: "a1-headword"
- tapOn:
    id: "a1-save"
- assertVisible:
    id: "a1-done"
- takeScreenshot: 03e_a1_saved
- tapOn: "Back"

# A4 Phrase (first A2 phrase: Estoy de acuerdo.) — a miss, the reveal, then a pass
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- tapOn:
    id: "today-module-A4"
- extendedWaitUntil:
    visible:
      id: "screen-a4"
    timeout: 10000
- takeScreenshot: 03f_a4_prompt
- tapOn:
    id: "a4-answer"
- inputText: "hola amigo"
- tapOn:
    id: "a4-meaning"
- tapOn:
    id: "a4-check"
- assertVisible:
    text: "Not quite.*"
- takeScreenshot: 03g_a4_miss
- tapOn:
    id: "a4-reveal"
- assertVisible:
    id: "a4-phrase"
- takeScreenshot: 03h_a4_revealed
- tapOn:
    id: "a4-answer"
- eraseText: 20
- inputText: "estoy de acuerdo"
- tapOn:
    id: "a4-meaning"
- tapOn:
    id: "a4-check"
- scrollUntilVisible:
    element:
      id: "a4-done"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- takeScreenshot: 03i_a4_done
- tapOn: "Back"

# A5 On this day (opening completes it); save the first event as a card
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- tapOn:
    id: "today-module-A5"
- extendedWaitUntil:
    visible:
      id: "screen-a5"
    timeout: 10000
- takeScreenshot: 03j_a5
- tapOn:
    id: "a5-save-0"
- assertVisible:
    text: "Saved as a review card.*"
- scroll
- takeScreenshot: 03k_a5_saved
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- takeScreenshot: 03l_today_after_learning

# D1 Morning top-3 (first field is the one hidden in v0.2.0)
- tapOn:
    id: "today-module-D1"
- extendedWaitUntil:
    visible:
      id: "screen-d1"
    timeout: 10000
- takeScreenshot: 04_d1_empty
- tapOn:
    id: "d1-priority-1"
- inputText: "Finish the layout fixes on every screen, review the simulator screenshots on both devices, ship 0.2.1"
- assertVisible:
    text: "Finish the layout fixes.*"
- tapOn:
    id: "d1-priority-2"
- inputText: "Short second priority"
- assertVisible:
    text: "Short second priority"
- tapOn:
    id: "d1-intro"
- takeScreenshot: 05_d1_filled
- tapOn:
    id: "d1-save"
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- takeScreenshot: 06_today_after_d1

# D2 Evening review
- tapOn:
    id: "today-module-D2"
- extendedWaitUntil:
    visible:
      id: "screen-d2"
    timeout: 10000
- tapOn:
    id: "d2-status-1-done"
- tapOn:
    id: "d2-status-2-partial"
- tapOn:
    id: "d2-note-2"
- inputText: "Halfway there"
- assertVisible:
    text: "Halfway there"
- tapOn:
    id: "d2-summary"
- takeScreenshot: 07_d2_marked
- tapOn: "Back"

# D3 Journal editor
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- tapOn:
    id: "today-module-D3"
- extendedWaitUntil:
    visible:
      id: "screen-journal-entry"
    timeout: 10000
- tapOn:
    id: "journal-body"
- inputText: "Spent the evening on layout fixes. The **header** no longer covers the first field, and every row keeps its label and value on one line."
- assertVisible:
    text: "Spent the evening.*"
- tapOn:
    id: "journal-completion-hint"
- takeScreenshot: 08_journal_editor
- tapOn:
    id: "journal-preview-toggle"
- takeScreenshot: 09_journal_preview
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 10000
- takeScreenshot: 10_today_complete
- scroll
- takeScreenshot: 11_today_ping_log

# Journal tab and search
- tapOn:
    id: "tab-journal"
- extendedWaitUntil:
    visible:
      id: "screen-journal"
    timeout: 10000
- takeScreenshot: 12_journal_list
- tapOn:
    id: "journal-search"
- inputText: "layout"
- assertVisible:
    text: "1 match"
- tapOn:
    id: "journal-results-count"
- takeScreenshot: 13_journal_search

# Stats and Review
- tapOn:
    id: "tab-stats"
- extendedWaitUntil:
    visible:
      id: "screen-stats"
    timeout: 10000
- takeScreenshot: 14_stats
- scroll
- takeScreenshot: 14a_stats_scrolled_1
- scroll
- takeScreenshot: 14b_stats_scrolled_2
- scroll
- takeScreenshot: 14c_stats_scrolled_3
- tapOn:
    id: "tab-review"
- extendedWaitUntil:
    visible:
      id: "screen-review"
    timeout: 10000
- takeScreenshot: 15_review

# Settings
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- takeScreenshot: 16_settings_top
- tapOn:
    id: "settings-passphrase-test"
- inputText: "maestro screenshot passphrase"
- tapOn:
    id: "settings-passphrase-test-run"
- assertVisible:
    text: "Correct: this passphrase unlocks your data."
- tapOn:
    id: "settings-intro"
- takeScreenshot: 17_settings_passphrase_tested
- scrollUntilVisible:
    element:
      id: "setting-schedule-morning_time"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- tapOn:
    id: "setting-schedule-morning_time"
- eraseText: 10
- inputText: "07:45"
- assertVisible:
    text: "07:45"
- tapOn:
    text: "Morning window"
- takeScreenshot: 18_settings_schedule
- scrollUntilVisible:
    element:
      id: "settings-backup-now"
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: "settings-backup-now"
- assertVisible:
    text: "Wrote microhabits_backup_.*"

# Export, then verify the export and the encrypted backup on the Restore screen
- scrollUntilVisible:
    element:
      id: "settings-export"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- tapOn:
    id: "settings-export"
- extendedWaitUntil:
    visible:
      id: "screen-export"
    timeout: 10000
- tapOn:
    id: "export-run"
- extendedWaitUntil:
    visible:
      id: "export-files"
    timeout: 10000
- takeScreenshot: 17a_export_done
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- tapOn:
    id: "settings-restore"
- extendedWaitUntil:
    visible:
      id: "screen-restore"
    timeout: 10000
- takeScreenshot: 17b_restore_files
- tapOn:
    text: "Exports/.*microhabits_export_.*json"
- tapOn:
    id: "restore-verify"
- extendedWaitUntil:
    visible:
      id: "restore-result"
    timeout: 30000
- assertVisible:
    text: "All table checksums match."
- takeScreenshot: 17c_restore_verified_export
- scrollUntilVisible:
    element:
      text: "microhabits_backup_.*mhbak"
    direction: UP
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- tapOn:
    text: "microhabits_backup_.*mhbak"
- tapOn:
    id: "restore-passphrase"
- inputText: "maestro screenshot passphrase"
- tapOn:
    text: "Recovery passphrase"
- tapOn:
    id: "restore-verify"
- extendedWaitUntil:
    visible:
      id: "restore-result"
    timeout: 30000
- assertVisible:
    text: "All table checksums match."
- takeScreenshot: 17d_restore_verified_backup
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings-intro"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
# Probe: after Export and Restore, a text field on Settings must still take typing.
- scrollUntilVisible:
    element:
      id: "setting-schedule-evening_time"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "setting-schedule-evening_time"
- eraseText: 10
- inputText: "21:15"
- takeScreenshot: 18b_settings_typing_after_detour
- assertVisible:
    text: "21:15"
    optional: true
- tapOn:
    text: "Evening window"
- scroll
- takeScreenshot: 19_settings_scrolled_1
- scroll
- takeScreenshot: 20_settings_scrolled_2
- scroll
- takeScreenshot: 21_settings_scrolled_3
- scroll
- takeScreenshot: 21a_settings_scrolled_4
- scroll
- takeScreenshot: 21b_settings_scrolled_5
- scrollUntilVisible:
    element:
      id: "setting-api-key"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- takeScreenshot: 22_settings_api_key
- scrollUntilVisible:
    element:
      id: "settings-generation-run"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- takeScreenshot: 22a_settings_bottom

# Diagnostics (waits for the full run), reached from Today
- tapOn:
    id: "tab-today"
- scrollUntilVisible:
    element:
      id: "today-diagnostics"
    direction: DOWN
# A tap during scroll momentum only stops the scroll; let it settle first.
- waitForAnimationToEnd
- tapOn:
    id: "today-diagnostics"
- extendedWaitUntil:
    visible:
      id: "diagnostics-summary"
      text: "\\d+/\\d+ passed"
    timeout: 180000
- takeScreenshot: 23_diagnostics_top
- scroll
- takeScreenshot: 24_diagnostics_scrolled
- scroll
- takeScreenshot: 25_diagnostics_scrolled_2
- scroll
- takeScreenshot: 26_diagnostics_scrolled_3
- scroll
- takeScreenshot: 27_diagnostics_bottom
- assertVisible:
    id: "diagnostics-summary"
    text: "20/20 passed"

